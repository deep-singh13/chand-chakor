<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Chaand Chakor — Diwali Prep Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Jost:ital,wght@0,400;0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F1ECDD;
    --panel:#F7F3E7;
    --ink:#15130F;
    --ink-soft:#3A362C;
    --muted:#746F5E;
    --line:rgba(21,19,15,0.18);
    --ring-track:rgba(21,19,15,0.15);
    --font-display:'Abril Fatface',Georgia,'Times New Roman',serif;
    --font-body:'Jost','Segoe UI',system-ui,sans-serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0E0D0B;
      --panel:#17150F;
      --ink:#F1ECDD;
      --ink-soft:#D8D2C0;
      --muted:#938D7B;
      --line:rgba(241,236,221,0.22);
      --ring-track:rgba(241,236,221,0.16);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E0D0B; --panel:#17150F; --ink:#F1ECDD; --ink-soft:#D8D2C0;
    --muted:#938D7B; --line:rgba(241,236,221,0.22); --ring-track:rgba(241,236,221,0.16);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  :focus-visible{outline:2px solid var(--ink);outline-offset:3px;}

  .wrap{max-width:720px;margin:0 auto;padding:0 20px 64px;}

  /* ---------- hero ---------- */
  .hero{padding:48px 20px 30px;text-align:center;}
  .hero-frame{
    max-width:420px;margin:0 auto;
    border:3px solid var(--ink);
    padding:6px;
    opacity:0;
    animation:rise 900ms ease-out forwards;
  }
  @keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion:reduce){ .hero-frame{animation:none;opacity:1;} }

  .hero-field{
    position:relative;
    overflow:hidden;
    border:1.5px solid var(--ink);
    padding:34px 22px;
  }
  .hero-field::before{
    content:'';
    position:absolute;top:50%;left:50%;
    width:160%;height:160%;
    background-image:
      linear-gradient(45deg, var(--ink) 25%, transparent 25%),
      linear-gradient(-45deg, var(--ink) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, var(--ink) 75%),
      linear-gradient(-45deg, transparent 75%, var(--ink) 75%);
    background-size:32px 32px;
    background-position:0 0, 0 16px, 16px -16px, -16px 0;
    background-color:var(--bg);
    transform:translate(-50%,-50%) rotate(45deg);
  }
  .title-card{
    position:relative;
    z-index:1;
    background:var(--panel);
    border:1.5px solid var(--ink);
    padding:30px 14px;
  }
  .title-card::before{
    content:'';position:absolute;inset:5px;border:1px solid var(--ink);pointer-events:none;
  }
  .corner{position:absolute;width:17px;height:17px;color:var(--ink);z-index:1;}
  .corner.tl{top:9px;left:9px;}
  .corner.tr{top:9px;right:9px;}
  .corner.bl{bottom:9px;left:9px;}
  .corner.br{bottom:9px;right:9px;}
  .corner svg{width:100%;height:100%;display:block;}

  .hero h1{
    font-family:var(--font-display);
    font-weight:400;
    font-size:clamp(2rem,8.5vw,2.75rem);
    line-height:1.08;
    letter-spacing:0.015em;
    text-transform:uppercase;
    color:var(--ink);
    margin:0;
  }
  .hero-sub{
    margin:18px 0 0;
    color:var(--muted);
    font-size:0.98rem;
    font-weight:400;
  }

  /* ---------- status bar ---------- */
  .status-bar{
    position:sticky;
    top:env(safe-area-inset-top,0px);
    z-index:10;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
  }
  .status-inner{
    max-width:720px;margin:0 auto;padding:12px 20px;
    display:flex;align-items:center;gap:14px;
  }
  .ring{flex:0 0 auto;}
  .status-text{flex:1;min-width:0;}
  .status-text .label1{font-weight:500;font-size:0.92rem;color:var(--ink);}
  .status-text .label2{font-weight:400;font-size:0.8rem;color:var(--muted);}
  .status-spend{
    flex:0 0 auto;text-align:right;font-weight:600;font-size:0.92rem;
    color:var(--ink);white-space:nowrap;
  }
  .status-spend span{display:block;font-weight:400;font-size:0.72rem;color:var(--muted);}

  /* ---------- categories ---------- */
  .category{border-top:1px solid var(--line);padding:30px 0 16px;}
  .category:first-of-type{margin-top:10px;}
  .ledger-head{
    display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    margin-bottom:14px;
  }
  .ledger-head h2{
    font-family:var(--font-body);
    font-style:italic;
    font-weight:500;
    font-size:1.5rem;
    letter-spacing:0.01em;
    margin:0;
    color:var(--ink);
  }
  .ledger-meta{text-align:right;font-size:0.82rem;color:var(--muted);line-height:1.4;}
  .ledger-meta .sum{display:block;font-weight:600;color:var(--ink-soft);font-size:0.9rem;}

  ul.items{list-style:none;margin:0;padding:0;}
  li.item{
    display:grid;
    grid-template-columns:26px 1fr auto 30px;
    align-items:flex-start;
    gap:4px 10px;
    padding:10px 0;
  }
  .item-body{min-width:0;}
  .item-name{
    display:block;font-weight:500;font-size:1rem;color:var(--ink);
    transition:opacity 200ms ease;
  }
  .item-sub{
    display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;
    margin-top:2px;
  }
  .item-note{font-size:0.82rem;color:var(--muted);}
  .item-source{
    font-size:0.68rem;font-weight:500;color:var(--muted);
    border:1px solid var(--line);border-radius:999px;
    padding:1px 8px;line-height:1.5;
  }
  .item-price{
    font-weight:600;font-size:0.92rem;color:var(--ink-soft);
    font-variant-numeric:tabular-nums;white-space:nowrap;
    transition:opacity 200ms ease;
    padding-top:2px;
  }
  li.item.done .item-name{opacity:0.42;text-decoration:line-through;text-decoration-color:var(--muted);}
  li.item.done .item-price{opacity:0.42;}

  /* moon checkbox */
  button.check{
    width:22px;height:22px;border-radius:50%;
    border:1.5px solid var(--ink);
    background:transparent;
    padding:0;cursor:pointer;
    margin-top:2px;
    transition:background 220ms ease, transform 150ms ease, box-shadow 220ms ease;
  }
  button.check:active{transform:scale(0.88);}
  button.check[aria-pressed="true"]{
    background:var(--ink);
    box-shadow:0 0 0 3px color-mix(in srgb, var(--ink) 15%, transparent);
  }

  /* edit control */
  button.edit-btn{
    width:28px;height:28px;margin-top:0;
    border:1px solid var(--line);
    background:transparent;border-radius:4px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;opacity:0;
    transition:opacity 150ms ease, background 150ms ease;
  }
  li.item:hover button.edit-btn,
  li.item:focus-within button.edit-btn{opacity:1;}
  @media (hover:none){ button.edit-btn{opacity:0.55;} }
  button.edit-btn:hover{background:var(--line);}
  button.edit-btn svg{width:14px;height:14px;stroke:var(--ink-soft);fill:none;stroke-width:1.6;}

  .field-panel{
    grid-column:1 / -1;
    margin-top:8px;
    padding:14px 14px 12px;
    border:1px solid var(--line);
    display:grid;
    gap:10px;
  }
  .field-panel[hidden]{display:none;}
  .field-panel label{
    display:block;font-size:0.72rem;color:var(--muted);font-weight:500;
  }
  .field-panel input{
    width:100%;margin-top:4px;
    border:none;border-bottom:1px solid var(--line);
    background:transparent;color:var(--ink);
    font:inherit;font-size:0.92rem;
    padding:5px 2px;
  }
  .field-panel input:focus{border-bottom-color:var(--ink);outline:none;}
  .edit-actions{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-top:2px;}
  .edit-actions button{font:inherit;font-size:0.82rem;cursor:pointer;}
  .edit-actions .save,
  .edit-actions .add-save{
    background:var(--ink);color:var(--bg);border:none;
    padding:7px 16px;font-weight:500;
  }
  .edit-actions .cancel,
  .edit-actions .add-cancel,
  .edit-actions .clear-fields,
  .edit-actions .delete-item{
    background:none;border:none;color:var(--muted);text-decoration:underline;padding:0;
  }
  .edit-actions .cancel:hover,
  .edit-actions .add-cancel:hover,
  .edit-actions .clear-fields:hover,
  .edit-actions .delete-item:hover{color:var(--ink);}
  .edit-actions .delete-item{margin-left:auto;}

  /* add item */
  button.add-toggle{
    display:block;width:100%;text-align:left;
    background:none;border:none;border-top:1px dashed var(--line);
    color:var(--muted);font:inherit;font-size:0.88rem;
    padding:14px 0 2px;margin-top:4px;cursor:pointer;
  }
  button.add-toggle:hover{color:var(--ink);}
  .add-panel{margin-top:10px;}

  footer{
    padding:34px 20px 10px;text-align:center;
    color:var(--muted);font-size:0.82rem;line-height:1.6;
  }
  footer button{
    background:none;border:none;color:var(--muted);
    text-decoration:underline;cursor:pointer;font:inherit;padding:0;
  }
  footer button:hover{color:var(--ink);}
</style>
</head>
<body>

<header class="hero">
  <div class="hero-frame">
    <div class="hero-field">
      <div class="title-card">
        <span class="corner tl" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
            <path d="M14.5 3.5a8.5 8.5 0 1 0 6 14.4 7 7 0 0 1-6-14.4z"/>
          </svg>
        </span>
        <span class="corner tr" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2 L13.8 9.2 L21 12 L13.8 14.8 L12 22 L10.2 14.8 L3 12 L10.2 9.2 Z"/>
          </svg>
        </span>
        <span class="corner bl" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2 L13.8 9.2 L21 12 L13.8 14.8 L12 22 L10.2 14.8 L3 12 L10.2 9.2 Z"/>
          </svg>
        </span>
        <span class="corner br" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2 L13.8 9.2 L21 12 L13.8 14.8 L12 22 L10.2 14.8 L3 12 L10.2 9.2 Z"/>
          </svg>
        </span>
        <h1>Chaand<br>Chakor</h1>
      </div>
    </div>
  </div>
  <p class="hero-sub">Diwali party — shopping &amp; prep checklist</p>
</header>

<div class="status-bar">
  <div class="status-inner">
    <svg class="ring" width="40" height="40" viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="20" cy="20" r="16" fill="none" stroke="var(--ring-track)" stroke-width="3.5"></circle>
      <circle id="ringProgress" cx="20" cy="20" r="16" fill="none" stroke="var(--ink)" stroke-width="3.5"
        stroke-linecap="round" transform="rotate(-90 20 20)"
        style="transition:stroke-dashoffset 300ms ease;"></circle>
    </svg>
    <div class="status-text">
      <span class="label1" id="progressLabel">0 of 0 ready</span>
      <span class="label2">tap a moon as you pick things up</span>
    </div>
    <div class="status-spend">
      <span>priced items</span>
      <span id="spendLabel">₹0</span>
    </div>
  </div>
</div>

<div class="wrap">
  <main id="categories"></main>

  <footer>
    <p>Saved on this device only.</p>
    <button id="resetBtn" type="button">Reset checklist</button>
  </footer>
</div>

<script>
(function(){
  var DATA = [
    { id:'drinks', label:'Drinks', items:[
      { id:'absolut', name:'Absolut', note:'× 2', price:2400 },
      { id:'bacardi', name:'Bacardi Limon', note:'× 1', price:800 },
      { id:'jimmy', name:'Jimmy Cocktails', note:'× 8', price:872 },
      { id:'coke', name:'Coke', note:'glass bottles · 2 L' },
      { id:'sprite', name:'Sprite', note:'4 L · 2 bottles', price:186 }
    ]},
    { id:'food', label:'Food', items:[
      { id:'chaap', name:'Malai Chaap', note:'× 2', price:560 },
      { id:'samosa', name:'Pizza Samosa', note:'5 plates', price:250 },
      { id:'momosnv', name:'Non-veg Momos', note:'× 3 plates', price:270 },
      { id:'momosv', name:'Veg Momos', note:'× 3', price:210 },
      { id:'popcorn', name:'Popcorn packets', note:'× 3', price:115 },
      { id:'candies', name:'Candies' },
      { id:'gulabjamun', name:'Gulab Jamun' },
      { id:'brownie', name:'Brownie', note:'× 2', price:400 }
    ]},
    { id:'disposables', label:'Disposables', items:[
      { id:'qplates', name:'Quarter plates' },
      { id:'glasses', name:'Glasses' },
      { id:'fork', name:'Fork' },
      { id:'spoon', name:'Spoon' },
      { id:'dplates', name:'Dinner plates' },
      { id:'tissue', name:'Tissue papers' },
      { id:'straw', name:'Straw' },
      { id:'bowls', name:'Bowls' }
    ]},
    { id:'decor', label:'Decorations', items:[
      { id:'curtains', name:'Silver curtains' },
      { id:'gota', name:'Silver gota', source:'Office' },
      { id:'pots', name:'Earthen pots', note:'2–3 big, 4–5 small' },
      { id:'flowers', name:'Flowers' },
      { id:'gajra', name:'Gajra', note:'× 20' },
      { id:'candlesw', name:'White candles' },
      { id:'candlesb', name:'Black candles' },
      { id:'phuljhadi', name:'Phuljhadi', note:'sparklers' },
      { id:'metalsheet', name:'Metallic sheet', note:'for star cut-outs' },
      { id:'tattoo', name:'Tattoo station' },
      { id:'upholstery', name:'Upholstery', source:'Mom' },
      { id:'lace', name:'Lace', source:'Mom' }
    ]},
    { id:'printables', label:'Printables', items:[
      { id:'entrycards', name:'Entry cards', note:'A5' },
      { id:'playingcards', name:'Playing cards', note:'3 decks' },
      { id:'tambola', name:'Tambola tickets', note:'× 100' },
      { id:'invites', name:'Invites', note:'card + ticket + envelope' },
      { id:'popcornbag', name:'Popcorn bag', note:'gateway' },
      { id:'bottlesticker', name:'Drink bottle sticker', note:'× 3' }
    ]},
    { id:'souvenirs', label:'Souvenirs', items:[
      { id:'shotglass', name:'Shot glasses', note:'engraved' },
      { id:'nametags', name:'Name tags', note:'silver cans' }
    ]}
  ];

  var CHECK_PREFIX   = 'chaandChakor:check:';
  var EDIT_PREFIX    = 'chaandChakor:edit:';
  var ADDED_PREFIX   = 'chaandChakor:added:';
  var DELETED_PREFIX = 'chaandChakor:deleted:';

  function getChecked(catId, itemId){
    try{ return localStorage.getItem(CHECK_PREFIX + catId + ':' + itemId) === '1'; }
    catch(e){ return false; }
  }
  function setChecked(catId, itemId, val){
    try{ localStorage.setItem(CHECK_PREFIX + catId + ':' + itemId, val ? '1' : '0'); }
    catch(e){}
  }
  function getEdit(catId, itemId){
    try{
      var raw = localStorage.getItem(EDIT_PREFIX + catId + ':' + itemId);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }
  function setEdit(catId, itemId, data){
    try{ localStorage.setItem(EDIT_PREFIX + catId + ':' + itemId, JSON.stringify(data)); }
    catch(e){}
  }
  function getAdded(catId){
    try{
      var raw = localStorage.getItem(ADDED_PREFIX + catId);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function persistAdded(catId, item){
    var arr = getAdded(catId);
    arr.push(item);
    try{ localStorage.setItem(ADDED_PREFIX + catId, JSON.stringify(arr)); }catch(e){}
  }
  function getDeleted(catId){
    try{
      var raw = localStorage.getItem(DELETED_PREFIX + catId);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function markDeleted(catId, itemId){
    var arr = getDeleted(catId);
    if (arr.indexOf(itemId) === -1) arr.push(itemId);
    try{ localStorage.setItem(DELETED_PREFIX + catId, JSON.stringify(arr)); }catch(e){}
  }
  function fmt(n){
    try{ return '₹' + n.toLocaleString('en-IN'); }
    catch(e){ return '₹' + n; }
  }
  function slugify(s){
    var base = s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-+|-+$)/g,'');
    return (base || 'item') + '-' + Date.now().toString(36).slice(-4);
  }

  // assemble each category's live item list: original + added, minus deleted, with edits applied
  DATA.forEach(function(cat){
    getAdded(cat.id).forEach(function(a){ cat.items.push(a); });
    var deleted = getDeleted(cat.id);
    if (deleted.length){
      cat.items = cat.items.filter(function(it){ return deleted.indexOf(it.id) === -1; });
    }
    cat.items.forEach(function(it){
      var e = getEdit(cat.id, it.id);
      if (e){
        it.note = e.note || undefined;
        it.price = (typeof e.price === 'number' && !isNaN(e.price)) ? e.price : undefined;
        it.source = e.source || undefined;
      }
    });
  });

  var root = document.getElementById('categories');
  var totalItems = 0, totalChecked = 0;
  var catSumEls = {};

  DATA.forEach(function(cat){
    cat.items.forEach(function(){ totalItems++; });
  });
  DATA.forEach(function(cat){
    cat.items.forEach(function(it){ if (getChecked(cat.id, it.id)) totalChecked++; });
  });

  function computeCategorySum(cat){
    var sum = 0;
    cat.items.forEach(function(it){ if (typeof it.price === 'number') sum += it.price; });
    return sum;
  }
  function computeGrandTotal(){
    var sum = 0;
    DATA.forEach(function(cat){ sum += computeCategorySum(cat); });
    return sum;
  }
  function refreshCategoryMeta(cat){
    var sum = computeCategorySum(cat);
    var el = catSumEls[cat.id];
    if (!el) return;
    el.innerHTML = cat.items.length + ' item' + (cat.items.length === 1 ? '' : 's') +
      (sum > 0 ? '<span class="sum">' + fmt(sum) + '</span>' : '');
  }
  function refreshSpend(){
    document.getElementById('spendLabel').textContent = fmt(computeGrandTotal());
  }
  function updateStatus(){
    document.getElementById('progressLabel').textContent =
      totalChecked + ' of ' + totalItems + ' ready';
    var pct = totalItems ? (totalChecked / totalItems) : 0;
    ringEl.style.strokeDashoffset = (CIRC * (1 - pct)).toFixed(2);
  }

  function renderItem(cat, it, ul){
    var li = document.createElement('li');
    li.className = 'item';
    if (getChecked(cat.id, it.id)) li.classList.add('done');

    var btn = document.createElement('button');
    btn.className = 'check';
    btn.type = 'button';
    btn.setAttribute('aria-pressed', getChecked(cat.id, it.id) ? 'true' : 'false');
    btn.setAttribute('aria-label', 'Mark ' + it.name + ' ready');

    var body = document.createElement('div');
    body.className = 'item-body';
    var nameEl = document.createElement('span');
    nameEl.className = 'item-name';
    nameEl.textContent = it.name;
    body.appendChild(nameEl);

    var sub = document.createElement('div');
    sub.className = 'item-sub';
    var noteEl = document.createElement('span');
    noteEl.className = 'item-note';
    noteEl.textContent = it.note || '';
    noteEl.style.display = it.note ? '' : 'none';
    var srcEl = document.createElement('span');
    srcEl.className = 'item-source';
    srcEl.textContent = it.source ? ('from ' + it.source) : '';
    srcEl.style.display = it.source ? '' : 'none';
    sub.appendChild(noteEl);
    sub.appendChild(srcEl);
    body.appendChild(sub);

    var priceEl = document.createElement('span');
    priceEl.className = 'item-price';
    priceEl.textContent = typeof it.price === 'number' ? fmt(it.price) : '';

    var editBtn = document.createElement('button');
    editBtn.type = 'button';
    editBtn.className = 'edit-btn';
    editBtn.setAttribute('aria-label', 'Edit ' + it.name);
    editBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M4 20h4L19.5 8.5a2.1 2.1 0 0 0-3-3L5 17v3z"/><path d="M13.5 6.5l4 4"/></svg>';

    var panel = document.createElement('div');
    panel.className = 'field-panel';
    panel.hidden = true;
    panel.innerHTML =
      '<label>Quantity / note<input type="text" class="f-note" placeholder="e.g. × 2"></label>' +
      '<label>Price (₹)<input type="number" class="f-price" min="0" step="1" placeholder="optional"></label>' +
      '<label>Extra note<input type="text" class="f-source" placeholder="e.g. from Office"></label>' +
      '<div class="edit-actions">' +
        '<button type="button" class="save">Save</button>' +
        '<button type="button" class="cancel">Cancel</button>' +
        '<button type="button" class="clear-fields">Clear fields</button>' +
        '<button type="button" class="delete-item">Delete item</button>' +
      '</div>';

    li.appendChild(btn);
    li.appendChild(body);
    li.appendChild(priceEl);
    li.appendChild(editBtn);
    li.appendChild(panel);
    ul.appendChild(li);

    btn.addEventListener('click', function(){
      var now = btn.getAttribute('aria-pressed') !== 'true';
      btn.setAttribute('aria-pressed', now ? 'true' : 'false');
      li.classList.toggle('done', now);
      setChecked(cat.id, it.id, now);
      totalChecked += now ? 1 : -1;
      updateStatus();
    });

    var fNote = panel.querySelector('.f-note');
    var fPrice = panel.querySelector('.f-price');
    var fSource = panel.querySelector('.f-source');

    editBtn.addEventListener('click', function(){
      fNote.value = it.note || '';
      fPrice.value = typeof it.price === 'number' ? it.price : '';
      fSource.value = it.source || '';
      panel.hidden = !panel.hidden;
      if (!panel.hidden) fNote.focus();
    });

    panel.querySelector('.cancel').addEventListener('click', function(){
      panel.hidden = true;
    });

    panel.querySelector('.clear-fields').addEventListener('click', function(){
      fNote.value = ''; fPrice.value = ''; fSource.value = '';
    });

    panel.querySelector('.save').addEventListener('click', function(){
      var noteVal = fNote.value.trim();
      var priceVal = fPrice.value.trim();
      var sourceVal = fSource.value.trim();

      it.note = noteVal || undefined;
      it.price = priceVal !== '' && !isNaN(parseFloat(priceVal)) ? parseFloat(priceVal) : undefined;
      it.source = sourceVal || undefined;

      setEdit(cat.id, it.id, { note: it.note, price: it.price, source: it.source });

      noteEl.textContent = it.note || '';
      noteEl.style.display = it.note ? '' : 'none';
      srcEl.textContent = it.source ? ('from ' + it.source) : '';
      srcEl.style.display = it.source ? '' : 'none';
      priceEl.textContent = typeof it.price === 'number' ? fmt(it.price) : '';

      refreshCategoryMeta(cat);
      refreshSpend();
      panel.hidden = true;
    });

    var delBtn = panel.querySelector('.delete-item');
    var delArmed = false, delTimer = null;
    delBtn.addEventListener('click', function(){
      if (!delArmed){
        delArmed = true;
        delBtn.textContent = 'Click again to delete';
        delTimer = setTimeout(function(){
          delArmed = false;
          delBtn.textContent = 'Delete item';
        }, 4000);
        return;
      }
      clearTimeout(delTimer);
      var wasChecked = li.classList.contains('done');
      markDeleted(cat.id, it.id);
      try{
        localStorage.removeItem(CHECK_PREFIX + cat.id + ':' + it.id);
        localStorage.removeItem(EDIT_PREFIX + cat.id + ':' + it.id);
      }catch(e){}
      var idx = cat.items.indexOf(it);
      if (idx > -1) cat.items.splice(idx, 1);
      totalItems--;
      if (wasChecked) totalChecked--;
      li.remove();
      refreshCategoryMeta(cat);
      refreshSpend();
      updateStatus();
    });
  }

  DATA.forEach(function(cat){
    var section = document.createElement('section');
    section.className = 'category';

    var head = document.createElement('div');
    head.className = 'ledger-head';
    var h2 = document.createElement('h2');
    h2.textContent = cat.label;
    var meta = document.createElement('div');
    meta.className = 'ledger-meta';
    head.appendChild(h2);
    head.appendChild(meta);
    section.appendChild(head);
    catSumEls[cat.id] = meta;
    refreshCategoryMeta(cat);

    var ul = document.createElement('ul');
    ul.className = 'items';
    cat.items.forEach(function(it){ renderItem(cat, it, ul); });
    section.appendChild(ul);

    var addToggle = document.createElement('button');
    addToggle.type = 'button';
    addToggle.className = 'add-toggle';
    addToggle.textContent = '+ Add item';

    var addPanel = document.createElement('div');
    addPanel.className = 'field-panel add-panel';
    addPanel.hidden = true;
    addPanel.innerHTML =
      '<label>Name<input type="text" class="a-name" placeholder="Item name"></label>' +
      '<label>Quantity / note<input type="text" class="a-note" placeholder="e.g. × 2"></label>' +
      '<label>Price (₹)<input type="number" class="a-price" min="0" step="1" placeholder="optional"></label>' +
      '<label>Extra note<input type="text" class="a-source" placeholder="e.g. from Office"></label>' +
      '<div class="edit-actions">' +
        '<button type="button" class="add-save">Add item</button>' +
        '<button type="button" class="add-cancel">Cancel</button>' +
      '</div>';

    section.appendChild(addToggle);
    section.appendChild(addPanel);
    root.appendChild(section);

    var aName = addPanel.querySelector('.a-name');
    var aNote = addPanel.querySelector('.a-note');
    var aPrice = addPanel.querySelector('.a-price');
    var aSource = addPanel.querySelector('.a-source');

    function resetAddPanel(){
      aName.value = ''; aNote.value = ''; aPrice.value = ''; aSource.value = '';
    }

    addToggle.addEventListener('click', function(){
      addPanel.hidden = !addPanel.hidden;
      if (!addPanel.hidden) aName.focus();
    });

    addPanel.querySelector('.add-cancel').addEventListener('click', function(){
      resetAddPanel();
      addPanel.hidden = true;
    });

    addPanel.querySelector('.add-save').addEventListener('click', function(){
      var nameVal = aName.value.trim();
      if (!nameVal){ aName.focus(); return; }
      var noteVal = aNote.value.trim();
      var priceVal = aPrice.value.trim();
      var sourceVal = aSource.value.trim();

      var newItem = {
        id: slugify(nameVal),
        name: nameVal,
        note: noteVal || undefined,
        price: priceVal !== '' && !isNaN(parseFloat(priceVal)) ? parseFloat(priceVal) : undefined,
        source: sourceVal || undefined
      };

      cat.items.push(newItem);
      persistAdded(cat.id, newItem);
      renderItem(cat, newItem, ul);

      totalItems++;
      updateStatus();
      refreshCategoryMeta(cat);
      refreshSpend();

      resetAddPanel();
      addPanel.hidden = true;
    });
  });

  refreshSpend();

  var ringEl = document.getElementById('ringProgress');
  var R = 16, CIRC = 2 * Math.PI * R;
  ringEl.style.strokeDasharray = CIRC.toFixed(2);
  updateStatus();

  var resetBtn = document.getElementById('resetBtn');
  var armed = false, armTimer = null;
  resetBtn.addEventListener('click', function(){
    if (!armed){
      armed = true;
      resetBtn.textContent = 'Tap again to clear everything';
      armTimer = setTimeout(function(){
        armed = false;
        resetBtn.textContent = 'Reset checklist';
      }, 4000);
      return;
    }
    clearTimeout(armTimer);
    try{
      DATA.forEach(function(cat){
        cat.items.forEach(function(it){
          localStorage.removeItem(CHECK_PREFIX + cat.id + ':' + it.id);
          localStorage.removeItem(EDIT_PREFIX + cat.id + ':' + it.id);
        });
        localStorage.removeItem(ADDED_PREFIX + cat.id);
        localStorage.removeItem(DELETED_PREFIX + cat.id);
      });
    }catch(e){}
    location.reload();
  });
})();
</script>
</body>
</html>
